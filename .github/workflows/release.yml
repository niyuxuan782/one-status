name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path apps/device-sidecar/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/device-sidecar/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/device-sidecar/Cargo.toml --locked
      - run: pnpm check
      - run: pnpm demo
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-cli
          if-no-files-found: error
          path: dist/one-status-*.tgz

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            rustTarget: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rustTarget: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      ONE_STATUS_SIDECAR_TARGET: ${{ matrix.rustTarget }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @one-status/desktop test
      - name: Validate Windows installer syntax
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'apps/site/public/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build Windows desktop
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          pnpm --dir apps/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --win nsis --x64 --publish never \
            --config.artifactName='One-Status-Setup-${version}-windows-${arch}.${ext}'
          pnpm --dir apps/desktop exec electron-builder \
            --win portable --x64 --publish never \
            --config.artifactName='One-Status-Portable-${version}-windows-${arch}.${ext}'
      - name: Build Linux desktop
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          pnpm --dir apps/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --linux AppImage deb --x64 --publish never \
            --config.artifactName='One-Status-${version}-linux-x64.${ext}'
      - name: Package standalone Device Sidecar
        shell: bash
        run: |
          executable='one-status-device-sidecar'
          if [[ '${{ matrix.platform }}' == 'windows' ]]; then
            executable='one-status-device-sidecar.exe'
          fi
          sidecar_binary="apps/desktop/dist/resources/bin/$executable"
          node scripts/package-device-sidecar.mjs \
            --platform '${{ matrix.platform }}' \
            --arch '${{ matrix.arch }}' \
            --binary "$sidecar_binary" \
            --output apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/One-Status-*.dmg
            apps/desktop/release/One-Status-*.zip
            apps/desktop/release/One-Status-*.exe
            apps/desktop/release/One-Status-*.AppImage
            apps/desktop/release/One-Status-*.deb
            apps/desktop/release/one-status-device-sidecar-*.tar.gz

  mac_build:
    name: macOS signed app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rustTarget: aarch64-apple-darwin
          - arch: x64
            rustTarget: x86_64-apple-darwin
    runs-on: macos-14
    timeout-minutes: 90
    env:
      ONE_STATUS_SIDECAR_TARGET: ${{ matrix.rustTarget }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @one-status/desktop test
      - name: Sign and archive app
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
        run: |
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "$variable is required for a public macOS release." >&2
              exit 1
            fi
          done
          if [[ -n "${CSC_NAME:-}" ]]; then
            case "$CSC_NAME" in
              Developer\ ID\ Application:*|Developer\ ID\ Installer:*|3rd\ Party\ Mac\ Developer\ Application:*|3rd\ Party\ Mac\ Developer\ Installer:*)
                echo "MACOS_CSC_NAME must omit the certificate type prefix." >&2
                exit 1
                ;;
            esac
          else
            export CSC_NAME="$APPLE_TEAM_ID"
          fi

          pnpm --dir apps/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --mac --dir --${{ matrix.arch }} --publish never \
            --config.mac.notarize=false

          app_path="$(find apps/desktop/release -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          sidecar_path="$app_path/Contents/Resources/bin/one-status-device-sidecar"
          test -x "$sidecar_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$sidecar_path"
          codesign -dvvv "$app_path" 2>&1 | tee /tmp/one-status-app-signature.txt
          codesign -dvvv "$sidecar_path" 2>&1 | tee /tmp/one-status-sidecar-signature.txt
          grep -q '^Authority=Developer ID Application:' /tmp/one-status-app-signature.txt
          grep -q '^Authority=Developer ID Application:' /tmp/one-status-sidecar-signature.txt
          grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' /tmp/one-status-app-signature.txt
          grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' /tmp/one-status-sidecar-signature.txt
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" /tmp/one-status-app-signature.txt
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" /tmp/one-status-sidecar-signature.txt

          mkdir -p apps/desktop/notary-staging
          app_archive="apps/desktop/notary-staging/one-status-signed-app-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$app_archive"
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-macos-signed-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          path: apps/desktop/notary-staging/*

  mac_app_submit:
    name: macOS app submission (${{ matrix.arch }})
    needs: mac_build
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: one-status-macos-signed-${{ matrix.arch }}
          path: apps/desktop/notary-staging
      - name: Submit exact signed app to Apple
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for variable in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "$variable is required for a public macOS release." >&2
              exit 1
            fi
          done

          app_archive="apps/desktop/notary-staging/one-status-signed-app-${{ matrix.arch }}.zip"
          submission="apps/desktop/notary-staging/app-submission-${{ matrix.arch }}.json"
          test -f "$app_archive"
          for attempt in 1 2 3; do
            if xcrun notarytool submit "$app_archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --output-format json >"$submission"; then
              break
            fi
            rm -f "$submission"
            if (( attempt == 3 )); then exit 1; fi
            sleep $(( attempt * 15 ))
          done
          jq -e '.id | strings | length > 0' "$submission"
          echo "Submitted app notarization $(jq -r '.id' "$submission")."
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-macos-app-submission-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          path: apps/desktop/notary-staging/app-submission-${{ matrix.arch }}.json

  mac_package:
    name: macOS package preparation (${{ matrix.arch }})
    needs: mac_app_submit
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: one-status-macos-signed-${{ matrix.arch }}
          path: apps/desktop/notary-staging
      - uses: actions/download-artifact@v4
        with:
          name: one-status-macos-app-submission-${{ matrix.arch }}
          path: apps/desktop/notary-staging
      - name: Wait for app notarization and package distributions
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
        run: |
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "$variable is required for a public macOS release." >&2
              exit 1
            fi
          done
          if [[ -z "${CSC_NAME:-}" ]]; then export CSC_NAME="$APPLE_TEAM_ID"; fi

          app_submission="apps/desktop/notary-staging/app-submission-${{ matrix.arch }}.json"
          app_archive="apps/desktop/notary-staging/one-status-signed-app-${{ matrix.arch }}.zip"
          test -f "$app_submission"
          test -f "$app_archive"
          app_submission_id="$(jq -er '.id' "$app_submission")"
          scripts/wait-for-apple-notarization.sh "$app_submission_id" 18000

          app_extract="$RUNNER_TEMP/one-status-app-${{ matrix.arch }}"
          mkdir -p "$app_extract"
          ditto -x -k "$app_archive" "$app_extract"
          app_path="$(find "$app_extract" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          sidecar_path="$app_path/Contents/Resources/bin/one-status-device-sidecar"
          test -x "$sidecar_path"
          for attempt in 1 2 3; do
            if xcrun stapler staple "$app_path"; then break; fi
            if (( attempt == 3 )); then exit 1; fi
            sleep $(( attempt * 15 ))
          done
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$sidecar_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          rm -rf apps/desktop/release
          pnpm --dir apps/desktop exec electron-builder \
            --mac dmg zip --${{ matrix.arch }} --publish never \
            --prepackaged "$app_path" \
            --config.mac.notarize=false \
            --config.artifactName='One-Status-${version}-mac-${arch}.${ext}'

          image="$(find apps/desktop/release -maxdepth 1 -type f -name 'One-Status-*.dmg' -print -quit)"
          archive="$(find apps/desktop/release -maxdepth 1 -type f -name 'One-Status-*.zip' -print -quit)"
          test -f "$image"
          test -f "$archive"
          codesign --verify --strict --verbose=2 "$image"
          codesign -dvvv "$image" 2>&1 | tee /tmp/one-status-dmg-signature.txt
          grep -q '^Authority=Developer ID Application:' /tmp/one-status-dmg-signature.txt
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" /tmp/one-status-dmg-signature.txt
          hdiutil verify "$image"

          node scripts/package-device-sidecar.mjs \
            --platform mac \
            --arch '${{ matrix.arch }}' \
            --binary "$sidecar_path" \
            --output apps/desktop/release
          sidecar_archive="$(find apps/desktop/release -maxdepth 1 -type f -name 'one-status-device-sidecar-*-mac-${{ matrix.arch }}.tar.gz' -print -quit)"
          test -f "$sidecar_archive"

          prepared="apps/desktop/one-status-macos-prepared-${{ matrix.arch }}.tar.gz"
          tar -czf "$prepared" -C apps/desktop/release \
            "$(basename "$image")" \
            "$(basename "$archive")" \
            "$(basename "$sidecar_archive")"
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-macos-prepared-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          path: apps/desktop/one-status-macos-prepared-${{ matrix.arch }}.tar.gz

  mac_dmg_submit:
    name: macOS DMG submission (${{ matrix.arch }})
    needs: mac_package
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: one-status-macos-prepared-${{ matrix.arch }}
          path: prepared
      - name: Submit exact DMG to Apple
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for variable in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "$variable is required for a public macOS release." >&2
              exit 1
            fi
          done

          payload="$RUNNER_TEMP/one-status-dmg-submit-${{ matrix.arch }}"
          mkdir -p "$payload" apps/desktop/notary-staging
          prepared="$(find prepared -maxdepth 1 -type f -name 'one-status-macos-prepared-*.tar.gz' -print -quit)"
          test -f "$prepared"
          tar -xzf "$prepared" -C "$payload"
          image="$(find "$payload" -maxdepth 1 -type f -name 'One-Status-*.dmg' -print -quit)"
          submission="apps/desktop/notary-staging/dmg-submission-${{ matrix.arch }}.json"
          test -f "$image"
          for attempt in 1 2 3; do
            if xcrun notarytool submit "$image" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --output-format json >"$submission"; then
              break
            fi
            rm -f "$submission"
            if (( attempt == 3 )); then exit 1; fi
            sleep $(( attempt * 15 ))
          done
          jq -e '.id | strings | length > 0' "$submission"
          echo "Submitted DMG notarization $(jq -r '.id' "$submission")."
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-macos-dmg-submission-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          path: apps/desktop/notary-staging/dmg-submission-${{ matrix.arch }}.json

  mac_notarize:
    name: macOS DMG notarization (${{ matrix.arch }})
    needs: mac_dmg_submit
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: one-status-macos-prepared-${{ matrix.arch }}
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          name: one-status-macos-dmg-submission-${{ matrix.arch }}
          path: apps/desktop/notary-staging
      - name: Wait for DMG notarization and verify distributions
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          payload="$RUNNER_TEMP/one-status-final-${{ matrix.arch }}"
          mkdir -p "$payload" apps/desktop/release
          prepared="$(find prepared -maxdepth 1 -type f -name 'one-status-macos-prepared-*.tar.gz' -print -quit)"
          test -f "$prepared"
          tar -xzf "$prepared" -C "$payload"

          image="$(find "$payload" -maxdepth 1 -type f -name 'One-Status-*.dmg' -print -quit)"
          archive="$(find "$payload" -maxdepth 1 -type f -name 'One-Status-*.zip' -print -quit)"
          sidecar_archive="$(find "$payload" -maxdepth 1 -type f -name 'one-status-device-sidecar-*.tar.gz' -print -quit)"
          dmg_submission="$(find apps/desktop/notary-staging -maxdepth 1 -type f -name 'dmg-submission-*.json' -print -quit)"
          test -f "$image"
          test -f "$archive"
          test -f "$sidecar_archive"
          test -f "$dmg_submission"

          dmg_submission_id="$(jq -er '.id' "$dmg_submission")"
          scripts/wait-for-apple-notarization.sh "$dmg_submission_id" 18000
          for attempt in 1 2 3; do
            if xcrun stapler staple "$image"; then break; fi
            if (( attempt == 3 )); then exit 1; fi
            sleep $(( attempt * 15 ))
          done
          xcrun stapler validate "$image"
          codesign --verify --strict --verbose=2 "$image"
          codesign -dvvv "$image" 2>&1 | tee /tmp/one-status-final-dmg-signature.txt
          grep -q '^Authority=Developer ID Application:' /tmp/one-status-final-dmg-signature.txt
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" /tmp/one-status-final-dmg-signature.txt
          hdiutil verify "$image"
          spctl --assess --type open \
            --context context:primary-signature \
            --verbose=4 "$image"

          mount_path="$RUNNER_TEMP/one-status-dmg-${{ matrix.arch }}"
          mkdir -p "$mount_path"
          hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount_path"
          cleanup_mount() {
            hdiutil detach "$mount_path" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          mounted_app="$(find "$mount_path" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$mounted_app"
          mounted_sidecar="$mounted_app/Contents/Resources/bin/one-status-device-sidecar"
          test -x "$mounted_sidecar"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          codesign --verify --strict --verbose=2 "$mounted_sidecar"
          codesign -dvvv "$mounted_app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          codesign -dvvv "$mounted_sidecar" 2>&1 | grep -q '^Authority=Developer ID Application:'
          codesign -dvvv "$mounted_app" 2>&1 | grep -Eq '^CodeDirectory .*flags=.*\(runtime\)'
          codesign -dvvv "$mounted_sidecar" 2>&1 | grep -Eq '^CodeDirectory .*flags=.*\(runtime\)'
          codesign -dvvv "$mounted_app" 2>&1 | grep -qx "TeamIdentifier=$APPLE_TEAM_ID"
          codesign -dvvv "$mounted_sidecar" 2>&1 | grep -qx "TeamIdentifier=$APPLE_TEAM_ID"
          xcrun stapler validate "$mounted_app"
          cleanup_mount
          trap - EXIT
          rmdir "$mount_path"

          zip_extract="$RUNNER_TEMP/one-status-zip-${{ matrix.arch }}"
          mkdir -p "$zip_extract"
          ditto -x -k "$archive" "$zip_extract"
          archived_app="$(find "$zip_extract" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$archived_app"
          codesign --verify --deep --strict --verbose=2 "$archived_app"
          xcrun stapler validate "$archived_app"

          sidecar_extract="$RUNNER_TEMP/one-status-sidecar-${{ matrix.arch }}"
          mkdir -p "$sidecar_extract"
          tar -xzf "$sidecar_archive" -C "$sidecar_extract" one-status-device-sidecar
          extracted_sidecar="$sidecar_extract/one-status-device-sidecar"
          codesign --verify --strict --verbose=2 "$extracted_sidecar"
          codesign -dvvv "$extracted_sidecar" 2>&1 | tee /tmp/one-status-final-sidecar-signature.txt
          grep -q '^Authority=Developer ID Application:' /tmp/one-status-final-sidecar-signature.txt
          grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' /tmp/one-status-final-sidecar-signature.txt
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" /tmp/one-status-final-sidecar-signature.txt

          cp "$image" "$archive" "$sidecar_archive" apps/desktop/release/
      - uses: actions/upload-artifact@v4
        with:
          name: one-status-desktop-mac-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          path: |
            apps/desktop/release/One-Status-*.dmg
            apps/desktop/release/One-Status-*.zip
            apps/desktop/release/one-status-device-sidecar-*.tar.gz

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, desktop, mac_notarize]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets
        run: |
          mkdir -p release-assets Casks
          find artifacts -type f \
            \( -name 'one-status-*.tgz' \
            -o -name 'One-Status-*.dmg' \
            -o -name 'One-Status-*.zip' \
            -o -name 'One-Status-*.exe' \
            -o -name 'One-Status-*.AppImage' \
            -o -name 'One-Status-*.deb' \
            -o -name 'one-status-device-sidecar-*.tar.gz' \) \
            -exec cp {} release-assets/ \;
          node scripts/generate-homebrew-formula.mjs \
            release-assets release-assets/one-status.rb
          node scripts/generate-homebrew-cask.mjs \
            release-assets Casks/one-status.rb
          cp Casks/one-status.rb release-assets/one-status-cask.rb
          (cd release-assets && sha256sum * | sort -k2 > SHA256SUMS.txt)
          test -f release-assets/One-Status-${GITHUB_REF_NAME#v}-mac-arm64.dmg
          test -f release-assets/One-Status-${GITHUB_REF_NAME#v}-mac-x64.dmg
          unzip -Z1 release-assets/One-Status-${GITHUB_REF_NAME#v}-mac-arm64.zip |
            grep -Eq '^(One Status|one-status)\.app/Contents/Info\.plist$'
          unzip -Z1 release-assets/One-Status-${GITHUB_REF_NAME#v}-mac-x64.zip |
            grep -Eq '^(One Status|one-status)\.app/Contents/Info\.plist$'
          test -f release-assets/One-Status-Setup-${GITHUB_REF_NAME#v}-windows-x64.exe
          test -f release-assets/One-Status-${GITHUB_REF_NAME#v}-linux-x64.AppImage
          test -f release-assets/one-status-${GITHUB_REF_NAME#v}.tgz
          for target in mac-arm64 mac-x64 windows-x64 linux-x64; do
            artifact="release-assets/one-status-device-sidecar-${GITHUB_REF_NAME#v}-$target.tar.gz"
            test -f "$artifact"
            tar -tzf "$artifact" | grep -Eq '(^|/)THIRD_PARTY_NOTICES\.device-sidecar\.md$'
            tar -tzf "$artifact" | grep -Eq '(^|/)licenses/cc-switch/LICENSE$'
          done
          tar -tzf "release-assets/one-status-device-sidecar-${GITHUB_REF_NAME#v}-windows-x64.tar.gz" |
            grep -Eq '(^|/)one-status-device-sidecar\.exe$'
          for target in mac-arm64 mac-x64 linux-x64; do
            tar -tzf "release-assets/one-status-device-sidecar-${GITHUB_REF_NAME#v}-$target.tar.gz" |
              grep -Eq '(^|/)one-status-device-sidecar$'
          done
      - name: Publish npm package when configured
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            npm publish release-assets/one-status-*.tgz
          else
            echo "NPM_TOKEN is not configured; skipping npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            One Status ${{ github.ref_name }} includes the encrypted model and
            credential Key Wallet, device and AI tool overview, Agent-managed
            account, SSH, cloud and card-key credentials, background-generated
            memory, unified Connections and Capability Packs, and updated Codex
            and Claude Code adapters.

            Every Desktop package embeds the native Device Sidecar. Separate
            Sidecar archives for macOS arm64/x64, Windows x64 and Linux x64
            support the CLI installer and Homebrew Formula. Release assets and
            the generated Formula are bound to SHA-256 checksums.

            macOS packages are signed with Developer ID, notarized by Apple,
            stapled, and verified with Gatekeeper before publication.
          files: release-assets/*
      - name: Update Homebrew tap when configured
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone niyuxuan782/homebrew-tap tap
          mkdir -p tap/Formula tap/Casks
          cp release-assets/one-status.rb tap/Formula/one-status.rb
          cp Casks/one-status.rb tap/Casks/one-status.rb
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/one-status.rb Casks/one-status.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "one-status ${GITHUB_REF_NAME#v}"
          git -C tap push origin main

  container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
