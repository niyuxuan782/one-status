_metadata:
  major_version: 2
display_information:
  name: One Status
  description: Use approved Slack actions through the One Status Gateway.
  background_color: "#161616"
oauth_config:
  redirect_urls:
    - http://127.0.0.1:8787/oauth/slack/callback
  scopes:
    user:
      - channels:read
      - groups:read
      - channels:history
      - groups:history
      - search:read
      - chat:write
  pkce_enabled: true
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
