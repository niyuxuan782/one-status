name: one-status-cloud

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: "one-status:${ONE_STATUS_IMAGE_TAG:-production}"
    restart: unless-stopped
    environment:
      ONE_STATUS_OPAQUE_SERVER_SETUP: "${ONE_STATUS_OPAQUE_SERVER_SETUP:?set ONE_STATUS_OPAQUE_SERVER_SETUP}"
      ONE_STATUS_RELEASE_ID: "${ONE_STATUS_IMAGE_TAG:-production}"
      ONE_STATUS_VAULT_SERVICE_TOKEN: "${ONE_STATUS_VAULT_SERVICE_TOKEN:?set ONE_STATUS_VAULT_SERVICE_TOKEN}"
      ONE_STATUS_VAULT_SERVICE_URL: "http://vault:8791"
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --db
      - /data/one-status.sqlite
      - --dashboard
      - "false"
      - --trust-proxy
      - "true"
      - --public-url
      - "https://${ONE_STATUS_DOMAIN:?set ONE_STATUS_DOMAIN}"
      - --remote-mcp
      - "true"
      - --oauth-issuer
      - "https://${ONE_STATUS_DOMAIN:?set ONE_STATUS_DOMAIN}"
      - --mcp-resource
      - "https://${ONE_STATUS_MCP_DOMAIN:?set ONE_STATUS_MCP_DOMAIN}/mcp"
    volumes:
      - "${ONE_STATUS_DATA_DIR:?set ONE_STATUS_DATA_DIR}:/data"
    expose:
      - "8787"
    depends_on:
      vault:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(async r=>{const j=await r.json();if(!r.ok||j.remoteMcp!=='ready'||j.cloudVault!=='configured')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - private

  vault:
    build:
      context: ..
      dockerfile: Dockerfile
    image: "one-status:${ONE_STATUS_IMAGE_TAG:-production}"
    restart: unless-stopped
    command:
      - vault-server
      - --host
      - 0.0.0.0
      - --port
      - "8791"
    environment:
      ONE_STATUS_VAULT_DATABASE_SSL: disable
      ONE_STATUS_VAULT_DATABASE_URL: "postgresql://one_status:${ONE_STATUS_POSTGRES_PASSWORD:?set ONE_STATUS_POSTGRES_PASSWORD}@postgres:5432/one_status_vault"
      ONE_STATUS_VAULT_KMS_KEY_ID: "${ONE_STATUS_VAULT_KMS_KEY_ID:?set ONE_STATUS_VAULT_KMS_KEY_ID}"
      ONE_STATUS_VAULT_KMS_REGION: "${ONE_STATUS_VAULT_KMS_REGION:?set ONE_STATUS_VAULT_KMS_REGION}"
      ONE_STATUS_VAULT_OPAQUE_SERVER_SETUP: "${ONE_STATUS_VAULT_OPAQUE_SERVER_SETUP:?set ONE_STATUS_VAULT_OPAQUE_SERVER_SETUP}"
      ONE_STATUS_VAULT_SERVICE_TOKEN: "${ONE_STATUS_VAULT_SERVICE_TOKEN:?set ONE_STATUS_VAULT_SERVICE_TOKEN}"
      TENCENTCLOUD_SECRET_ID: "${TENCENTCLOUD_SECRET_ID:?set TENCENTCLOUD_SECRET_ID}"
      TENCENTCLOUD_SECRET_KEY: "${TENCENTCLOUD_SECRET_KEY:?set TENCENTCLOUD_SECRET_KEY}"
      TENCENTCLOUD_SESSION_TOKEN: "${TENCENTCLOUD_SESSION_TOKEN:-}"
    expose:
      - "8791"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8791/health',{headers:{authorization:'Bearer '+process.env.ONE_STATUS_VAULT_SERVICE_TOKEN}}).then(async r=>{const j=await r.json();if(!r.ok||j.kms!=='ready')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - private

  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_DB: one_status_vault
      POSTGRES_PASSWORD: "${ONE_STATUS_POSTGRES_PASSWORD:?set ONE_STATUS_POSTGRES_PASSWORD}"
      POSTGRES_USER: one_status
    volumes:
      - "${ONE_STATUS_POSTGRES_DATA_DIR:?set ONE_STATUS_POSTGRES_DATA_DIR}:/var/lib/postgresql/data"
    tmpfs:
      - /run/postgresql:rw,noexec,nosuid,uid=999,gid=999,mode=0775,size=8m
      - /tmp:rw,noexec,nosuid,uid=999,gid=999,mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U one_status -d one_status_vault"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - private

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ONE_STATUS_ACME_EMAIL: "${ONE_STATUS_ACME_EMAIL:?set ONE_STATUS_ACME_EMAIL}"
      ONE_STATUS_DOMAIN: "${ONE_STATUS_DOMAIN:?set ONE_STATUS_DOMAIN}"
      ONE_STATUS_MCP_DOMAIN: "${ONE_STATUS_MCP_DOMAIN:?set ONE_STATUS_MCP_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${ONE_STATUS_CADDY_DATA_DIR:?set ONE_STATUS_CADDY_DATA_DIR}:/data"
      - "${ONE_STATUS_CADDY_CONFIG_DIR:?set ONE_STATUS_CADDY_CONFIG_DIR}:/config"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - private

networks:
  private:
    driver: bridge
